# v++ link connectivity for linking all six kernels into one xclbin (HBM
# placement from FpgaModel::print_hbm_plan). Used by `make -C src/host xclbin_hw`
# (all six kernels) and, filtered per kernel, by `make hw_emu` in
# kernels/<name>. TAPA names the ports of mmaps<T, N> w as w_0..w_N-1.
#   v++ -l -t hw --platform xilinx_u55c_gen3x16_xdma_3_202210_1 \
#       --config link_config.ini build/kernels/{gemv,layernorm,gelu,residual,attention,lm_head}/*.xo \
#       -o build/gpt2.xclbin
[connectivity]
nk=GemvKernel:1
nk=LmHeadKernel:1
nk=AttentionKernel:1
nk=LayerNormKernel:1
nk=GeluKernel:1
nk=ResidualKernel:1

# GEMV weights: one HBM pseudo-channel per port (42.5 MB each, all layers)
sp=GemvKernel_1.w_0:HBM[0]
sp=GemvKernel_1.w_1:HBM[1]
sp=GemvKernel_1.w_2:HBM[2]
sp=GemvKernel_1.w_3:HBM[3]
sp=GemvKernel_1.w_4:HBM[4]
sp=GemvKernel_1.w_5:HBM[5]
sp=GemvKernel_1.w_6:HBM[6]
sp=GemvKernel_1.w_7:HBM[7]
sp=GemvKernel_1.x:HBM[18]
sp=GemvKernel_1.bias:HBM[18]
sp=GemvKernel_1.residual:HBM[18]
sp=GemvKernel_1.y:HBM[18]

# LM head (packed wte, 19.3 MB per channel)
sp=LmHeadKernel_1.w_0:HBM[8]
sp=LmHeadKernel_1.w_1:HBM[9]
sp=LmHeadKernel_1.w_2:HBM[10]
sp=LmHeadKernel_1.w_3:HBM[11]
sp=LmHeadKernel_1.w_4:HBM[12]
sp=LmHeadKernel_1.w_5:HBM[13]
sp=LmHeadKernel_1.w_6:HBM[14]
sp=LmHeadKernel_1.w_7:HBM[15]
sp=LmHeadKernel_1.x:HBM[18]
sp=LmHeadKernel_1.result:HBM[18]

# KV cache: K and V on separate channels so both stream at full port rate
sp=AttentionKernel_1.kcache:HBM[16]
sp=AttentionKernel_1.vcache:HBM[17]
sp=AttentionKernel_1.qkv:HBM[18]
sp=AttentionKernel_1.attn_out:HBM[18]

# small vectors and parameters
sp=LayerNormKernel_1.x:HBM[18]
sp=LayerNormKernel_1.gamma:HBM[18]
sp=LayerNormKernel_1.beta:HBM[18]
sp=LayerNormKernel_1.y:HBM[18]
sp=GeluKernel_1.x:HBM[18]
sp=GeluKernel_1.y:HBM[18]
sp=ResidualKernel_1.a:HBM[18]
sp=ResidualKernel_1.b:HBM[18]
sp=ResidualKernel_1.y:HBM[18]
